<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ian ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      color: #fff;
    }

    /* Fondo de estrellas de galaxia */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0% { opacity: 0; transform: scale(0.3); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(0.3); }
    }

    /* Tarjeta principal */
    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 30px 20px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      position: relative;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 15px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* Animación de Flores */
    .flower-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .flower {
      font-size: 2.5rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.6));
    }

    .flower:nth-child(2) { animation-delay: 1s; }
    .flower:nth-child(3) { animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(10deg); }
    }

    /* Mensaje de amor */
    .message {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f1f1f1;
      margin: 20px 0;
      font-style: italic;
    }

    /* Reproductor de Música */
    .music-player {
      margin-top: 25px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .play-btn {
      background: #ff69b4;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
    }

    .play-btn:hover {
      background: #ff1493;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Fondo animado de galaxia -->
  <div class="stars" id="starsContainer"></div>

  <!-- Tarjeta con la dedicatoria -->
  <div class="card">
    <h1>🌸 Para Ian 🌸</h1>

    <div class="flower-container">
      <span class="flower">🌸</span>
      <span class="flower">🌻</span>
      <span class="flower">🌺</span>
    </div>

    <p class="message">
      "Feliz inicio de primavera Ian, sin importar nada, en mi mente y corazón siempre habrá un lugar que te pertenece, te amo"
    </p>

    <!-- Reproductor de audio -->
    <div class="music-player">
      <button class="play-btn" onclick="togglePlay()" id="musicBtn">🎵 Reproducir Música</button>
      <!-- Reemplaza la URL del atributo src con el enlace de tu canción favorita -->
      <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    </div>
  </div>

  <script>
    // Generador de estrellas
    const starsContainer = document.getElementById('starsContainer');
    const numberOfStars = 80;

    for (let i = 0; i < numberOfStars; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      
      const size = Math.random() * 3 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.animationDuration = `${Math.random() * 3 + 2}s`;
      
      starsContainer.appendChild(star);
    }

    // Control de música
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        musicBtn.textContent = '⏸️ Pausar Música';
      } else {
        audio.pause();
        musicBtn.textContent = '🎵 Reproducir Música';
      }
    }
  </script>
</body>
</html>
